[project]
name = "claude-rotator"
version = "0.6.0"
description = "Rotate several Claude subscriptions behind one Claude Code setup via a local proxy"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Phaleanopsis" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
# Add-ons are separate distributions under packages/, so the base install ships none of their code.
science = ["claude-rotator-science"]

[project.scripts]
claude-rotator = "claude_rotator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "claude-rotator-science"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
claude-rotator-science = { workspace = true }

[build-system]
requires = ["uv_build>=0.7.21,<0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/claude-rotator-science/tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff.lint.isort]
known-first-party = ["claude_rotator", "claude_rotator_science"]
