[project]
name = "claude-roulette"
version = "0.6.0"
description = "Use several Claude subscriptions from one Claude Code setup via a local proxy"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Phaleanopsis" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
claude-roulette = "claude_roulette.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.7.21,<0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff.lint.isort]
known-first-party = ["claude_roulette"]
